<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/sbp logo.png" />
    <title>Semaj Bank of the Philippines</title>
  </head>
  <body>
    <h1>Semaj Bank of the Philippines</h1>
    <p>Welcome to the Semaj Bank of the Philippines!</p>

    <form action="process.php" method="post">
      <label for="username">Username:</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="user_123"
        minlength="8"
        maxlength="10"
        required
      />
      <br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        maxlength="8"
        required
      />
      <br />

      <button type="submit">Login</button>
      <br />
      <button type="button" onclick="window.location.href = 'register.html'">
        Sign Up
      </button>
    </form>
  </body>
</html>
