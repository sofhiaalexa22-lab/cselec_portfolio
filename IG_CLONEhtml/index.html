<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="icon" type="image/png" href="photos/IG_favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
    
    <div class="box">
        <div id="logo" >
        <img src="photos/instagram_logo.png" alt="instagram logo" height="90px" width="90px">
    </div>
        <section>
        <h1>See everyday moments from</h1>
        <p>your <span>close friends.</span></p>
        <img src="photos/ig_pic.png" alt="photo of an instagram story" id="story" height="280px" width="280px">
        </section>
    </div>
    <div class="box">
        <h2><span class="caption">Log into Instagram</span></h2>
        <form>
        <input type="text" name="username" placeholder="Mobile number, username or email">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Log In</button>
    </form>
        <div class="forgot-password">
        <a href="forgot-password.html">Forgot password</a>
        </div>
        <button type="button">Log in with Facebook</button>
        <a href="sign_up.html">Create new account</a>

    </div>
    </div>
    <footer>

    </footer>
</body>
</html>
